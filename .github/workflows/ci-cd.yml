name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  website:
    name: Website builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  server:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_NAME: g_link
      DB_SSL: 'false'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server packages
        run: npm ci

      - name: Check every server file for syntax errors
        run: for f in $(find src scripts tests -name '*.js'); do node --check "$f"; done

      - name: Unit tests
        run: npm test

      - name: Build the database from all_in_one.sql
        run: mysql -h 127.0.0.1 -P 3306 -u root -pci_root_password < ../database/all_in_one.sql

      - name: Check all tables and columns exist
        run: |
          npm run check-db | tee check-db.txt
          if grep -q MISSING check-db.txt; then echo "::error::A table or column is missing"; exit 1; fi

      - name: Integration tests
        run: npm run test:integration

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_root_password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci_root_password
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install packages
        run: |
          npm ci --prefix server
          npm ci --prefix client
          npm ci --prefix e2e

      - name: Install the test browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: e2e
        run: npx playwright test

      - name: Save the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  deploy:
    name: Deploy to Render
    needs: [website, server, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the server
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_SERVER }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_SERVER is not set, skipping"; exit 0; fi
          curl -sf -X POST "$HOOK" > /dev/null && echo "Server deploy started on Render"
      - name: Deploy the website
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_CLIENT }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::RENDER_DEPLOY_HOOK_CLIENT is not set, skipping"; exit 0; fi
          curl -sf -X POST "$HOOK" > /dev/null && echo "Website deploy started on Render"
